<!DOCTYPE html>
<html>
<head>
  <title>The Annual Ledger Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 60px;
    }

    .card {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 0;
      padding: 30px;
      max-width: 560px;
      margin: auto;
    }

    h1 {
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 24px;
    }

    .output-box {
      border: 2px solid #000000;
      padding: 20px;
      margin: 22px 0;
    }

    .output-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    #score {
      font-size: 72px;
      font-weight: bold;
      color: #000000;
      line-height: 1;
    }

    #domain {
      font-size: 28px;
      font-weight: bold;
      color: #000000;
      margin-top: 8px;
    }

    button {
      background: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: #ffffff;
      color: #000000;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #000000;
      line-height: 1.5;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="label">ANNUAL LEDGER</div>

    <h1>Ledger Entry Generator</h1>

    <div class="output-box">
      <div class="output-label">Score Change</div>
      <div id="score">--</div>
    </div>

    <div class="output-box">
      <div class="output-label">Domain</div>
      <div id="domain">--</div>
    </div>

    <button onclick="generateEntry()">Generate</button>

    <p class="note">
      Scores range from -200 to +200. Lower magnitudes are more common; major score changes are rare.
    </p>
  </div>

  <script>
    const domains = [
      "Work / School",
      "Interpersonal Relationships",
      "Civic Responsibility",
      "Consumption / Money",
      "Environment / Ecology"
    ];

    function generateEntry() {
      // Generate score magnitude from 0 to 200.
      // Cubing the random value makes lower magnitudes much more common.
      let randomValue = Math.random();
      let skewedValue = randomValue * randomValue * randomValue;
      let score = Math.round(skewedValue * 200);

      // 50/50 chance of positive or negative.
      let sign = Math.random() < 0.5 ? -1 : 1;
      let finalScore = score * sign;

      // Randomly select a domain.
      let randomDomainIndex = Math.floor(Math.random() * domains.length);
      let domain = domains[randomDomainIndex];

      document.getElementById("score").textContent =
        finalScore > 0 ? "+" + finalScore : finalScore;

      document.getElementById("domain").textContent = domain;
    }
  </script>
</body>
</html>
