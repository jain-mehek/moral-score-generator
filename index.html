<!DOCTYPE html>
<html>
<head>
  <title>Ledger Entry Value Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #000000;
      text-align: center;
      padding: 60px;
    }

    .card {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 0;
      padding: 30px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 24px;
    }

    #score {
      font-size: 72px;
      font-weight: bold;
      color: #000000;
      margin: 30px 0;
      border: 2px solid #000000;
      padding: 20px;
    }

    button {
      background: #000000;
      color: #ffffff;
      border: 2px solid #000000;
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: #ffffff;
      color: #000000;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #000000;
      line-height: 1.5;
    }

    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="label">ANNUAL LEDGER</div>

    <h1>Ledger Entry Score Generator</h1>

    <div id="score">--</div>

    <button onclick="generateScore()">Generate</button>

    <p class="note">
      Scores range from -200 to +200. Lower magnitudes are more common; major score changes are rare.
    </p>
  </div>

  <script>
    function generateScore() {
      let randomValue = Math.random();
      let skewedValue = randomValue * randomValue;

      let score = Math.round(skewedValue * 200);

      let sign = Math.random() < 0.5 ? -1 : 1;
      let finalScore = score * sign;

      document.getElementById("score").textContent =
        finalScore > 0 ? "+" + finalScore : finalScore;
    }
  </script>
</body>
</html>
